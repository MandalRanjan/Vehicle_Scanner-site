<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%" role="img" aria-label="Step 3: Firmly press onto windshield">
  <rect width="160" height="120" rx="16" fill="#F5EDE0"/>
  <!-- Glass surface -->
  <line x1="20" y1="100" x2="140" y2="100" stroke="#0F4C5C" stroke-width="4"/>
  <!-- Sticker affixed -->
  <rect x="45" y="45" width="70" height="52" rx="8" fill="#FBF6EE" stroke="#0F4C5C" stroke-width="2"/>
  <circle cx="80" cy="71" r="14" fill="#2A7261"/>
  <path d="M75 71 L79 75 L86 67" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Thumb pressing icon -->
  <g transform="translate(70, 20)">
    <path d="M10 0 L10 18" stroke="#FF6B4A" stroke-width="3" stroke-linecap="round"/>
    <polygon points="5,15 10,22 15,15" fill="#FF6B4A"/>
    <!-- Pressure waves -->
    <path d="M-5 18 Q10 24 25 18" stroke="#FF6B4A" stroke-width="1.5" fill="none"/>
  </g>
</svg>
