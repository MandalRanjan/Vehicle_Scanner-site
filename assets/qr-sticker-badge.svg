<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%" role="img" aria-label="Physical QR Vehicle Tag Decal">
  <defs>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#1E2A32" flood-opacity="0.16"/>
    </filter>
  </defs>
  <!-- Base Tag with 2-degree tilt -->
  <g transform="rotate(-2 140 140)" filter="url(#badgeShadow)">
    <!-- Vinyl Material Outline -->
    <rect x="20" y="15" width="240" height="250" rx="22" fill="#FBF6EE" stroke="#0F4C5C" stroke-width="3"/>
    
    <!-- Top Teal Header Bar -->
    <path d="M20 37 Q20 15 42 15 L238 15 Q260 15 260 37 L260 62 L20 62 Z" fill="#0F4C5C"/>
    <text x="140" y="44" text-anchor="middle" font-family="'Sora', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">DEMO START-UP</text>
    <text x="140" y="56" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" fill="#EADFCB" letter-spacing="0.5">SMART VEHICLE CONTACT SHIELD</text>

    <!-- QR Code Container -->
    <rect x="50" y="76" width="180" height="150" rx="12" fill="#FFFFFF" stroke="#EADFCB" stroke-width="2"/>
    
    <!-- Big QR Patterns -->
    <!-- Top-Left Target -->
    <rect x="62" y="88" width="40" height="40" rx="6" fill="#0F4C5C"/>
    <rect x="70" y="96" width="24" height="24" rx="3" fill="#FFFFFF"/>
    <rect x="77" y="103" width="10" height="10" rx="1.5" fill="#0F4C5C"/>

    <!-- Top-Right Target -->
    <rect x="178" y="88" width="40" height="40" rx="6" fill="#0F4C5C"/>
    <rect x="186" y="96" width="24" height="24" rx="3" fill="#FFFFFF"/>
    <rect x="193" y="103" width="10" height="10" rx="1.5" fill="#0F4C5C"/>

    <!-- Bottom-Left Target -->
    <rect x="62" y="174" width="40" height="40" rx="6" fill="#0F4C5C"/>
    <rect x="70" y="182" width="24" height="24" rx="3" fill="#FFFFFF"/>
    <rect x="77" y="189" width="10" height="10" rx="1.5" fill="#0F4C5C"/>

    <!-- Interior Dynamic QR Dots -->
    <rect x="114" y="90" width="10" height="16" fill="#1E2A32"/>
    <rect x="130" y="90" width="20" height="8" fill="#FF6B4A"/>
    <rect x="156" y="90" width="10" height="24" fill="#0F4C5C"/>
    <rect x="114" y="112" width="36" height="10" fill="#1E2A32"/>
    <rect x="114" y="128" width="14" height="20" fill="#2A7261"/>
    <rect x="134" y="134" width="16" height="14" fill="#1E2A32"/>
    <rect x="156" y="124" width="14" height="24" fill="#FF6B4A"/>
    <rect x="178" y="136" width="16" height="12" fill="#1E2A32"/>
    <rect x="200" y="136" width="18" height="18" fill="#0F4C5C"/>
    <rect x="114" y="156" width="26" height="12" fill="#0F4C5C"/>
    <rect x="146" y="156" width="24" height="12" fill="#1E2A32"/>
    <rect x="114" y="174" width="16" height="24" fill="#FF6B4A"/>
    <rect x="136" y="174" width="24" height="10" fill="#1E2A32"/>
    <rect x="166" y="174" width="14" height="24" fill="#2A7261"/>
    <rect x="186" y="174" width="32" height="10" fill="#1E2A32"/>
    <rect x="136" y="190" width="24" height="20" fill="#0F4C5C"/>
    <rect x="186" y="190" width="14" height="20" fill="#FF6B4A"/>
    <rect x="206" y="190" width="12" height="20" fill="#1E2A32"/>

    <!-- Center Security Emblem -->
    <circle cx="140" cy="151" r="18" fill="#FBF6EE" stroke="#0F4C5C" stroke-width="2.5"/>
    <path d="M140 140 L132 144 v7 c0 5 3.5 9 8 10 4.5-1 8-5 8-10v-7 L140 140z" fill="#0F4C5C"/>
    <path d="M137 149 L139 152 L144 146" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Bottom Tag Instructions -->
    <text x="140" y="244" text-anchor="middle" font-family="'Sora', sans-serif" font-size="12" font-weight="700" fill="#0F4C5C" letter-spacing="0.5">SCAN WITH ANY CAMERA</text>
    <text x="140" y="258" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#5B6A75">No App Required • Number Masked 100%</text>
  </g>
</svg>
